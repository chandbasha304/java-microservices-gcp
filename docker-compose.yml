version: '3.8'

services:
  # 1. API Gateway (Entry Point / Reverse Proxy)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:8081
      - ORDER_SERVICE_URL=http://order-service:8082
      - NOTIFICATION_SERVICE_URL=http://notification-service:8083
    depends_on:
      - auth-service
      - order-service
      - notification-service
    restart: always

  # PostgreSQL Database Container (Database-per-Service Isolation)
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # 2. Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_URL=jdbc:postgresql://postgres-db:5432/auth_db
      - DB_DRIVER=org.postgresql.Driver
      - DB_USER=postgres
      - DB_PASS=postgrespassword
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      - postgres-db
    restart: always

  # 3. Order Service
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - DB_URL=jdbc:postgresql://postgres-db:5432/order_db
      - DB_DRIVER=org.postgresql.Driver
      - DB_USER=postgres
      - DB_PASS=postgrespassword
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - NOTIFICATION_SERVICE_URL=http://notification-service:8083
    depends_on:
      - postgres-db
      - notification-service
    restart: always

  # 4. Notification Service
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
    restart: always

  # 5. Auth Client (React Web UI)
  auth-client:
    build:
      context: ./auth-client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
    container_name: auth-client
    ports:
      - "80:8080"
    depends_on:
      - api-gateway
    restart: always

  # 6. Prometheus (Metrics UI)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  # 7. Zipkin / Jaeger (Distributed Tracing UI)
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    restart: always

volumes:
  postgres_data:


