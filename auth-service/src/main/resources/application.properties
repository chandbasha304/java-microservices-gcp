spring.application.name=auth-service
server.port=${PORT:8080}

# Database Configuration (Falls back to H2 in-memory DB on Cloud Run containers)
spring.datasource.url=${DB_URL:jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=0123456789012345678901234567890123456789012345678901234567890123
jwt.expiration=900000

# Enable Java 21 Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true