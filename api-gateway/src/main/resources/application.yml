server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      routes:
        # Kubernetes DNS Route to Auth Service
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service.microservices.svc.cluster.local:8080}
          predicates:
            - Path=/auth/**

        # Kubernetes DNS Route to Order Service with Circuit Breaker
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://order-service.microservices.svc.cluster.local:8080}
          predicates:
            - Path=/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderServiceCB
                fallbackUri: forward:/fallback/orders

resilience4j:
  circuitbreaker:
    instances:
      orderServiceCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

jwt:
  secret: 0123456789012345678901234567890123456789012345678901234567890123
