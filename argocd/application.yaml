apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-microservices-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/chandbasha304/java-microservices-gcp.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: microservices
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
